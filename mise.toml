# Herdr — Tauri 2 (pnpm + cargo). `mise tasks` lists them, `mise run <task>` runs one.
min_version = "2026.9.0"

[settings]
experimental = true # [deps] is experimental

# Same majors as .github/workflows/release.yml.
[tools]
node = "24"
pnpm = "11"
# stable, as CI's dtolnay/rust-toolchain@stable. Without a pin the cargo shim fails with
# "No version is set for shim" in a shell that lacks ~/.cargo/bin on PATH.
rust = "stable"

[env]
APP = "src-tauri/target/release/bundle/macos/Herdr.app"
LOCAL_APP = "src-tauri/target/local/bundle/macos/Herdr.app"

# Frontend dependencies install before any `mise run` when the lockfile changed.
# By hand: `mise deps`.
[deps.pnpm]
auto = true

# The global dispatcher (~/.config/git/hooks/ct-hook-dispatch) already runs
# .githooks; a local core.hooksPath would bypass it, so set one only without it.
[tasks.setup]
description = "One-time setup after cloning: wire the pre-commit gate"
run = """
hooks_dir=$(git config --global --get core.hooksPath) || hooks_dir=
case "$hooks_dir" in
  "~") hooks_dir=$HOME ;;
  "~/"*) hooks_dir="$HOME/${hooks_dir#"~/"}" ;;
esac
if [ -n "$hooks_dir" ] && [ -x "$hooks_dir/ct-hook-dispatch" ]; then
  [ "$(git config --local --get core.hooksPath)" = ".githooks" ] && git config --local --unset core.hooksPath
  echo 'git hooks: global dispatcher runs .githooks'
else
  git config core.hooksPath .githooks
  echo 'git hooks: core.hooksPath=.githooks'
fi
echo 'next: mise run dev'
"""

# Its own identifier (tauri.dev.conf.json): a separate data dir and ssh control sockets, so it
# runs beside the installed Herdr.app without sharing machines or ending its ssh masters.
[tasks.dev]
description = "Run the app with hot reload, apart from the installed app"
run = "pnpm tauri dev --config src-tauri/tauri.dev.conf.json"

[tasks.build]
description = "Build the release bundle (Herdr.app)"
run = "pnpm tauri build --bundles app"

# The release build minus LTO (src-tauri/Cargo.toml [profile.local]): same behaviour, about 3x
# faster to rebuild. For the bundle a release ships, use `build`.
[tasks."build:local"]
description = "Build the bundle without LTO (Herdr.app under target/local)"
run = "pnpm tauri build --bundles app -- --profile local"

[tasks.start]
description = "Build the release bundle and open it"
depends = ["build"]
run = "open $APP"

# Replaces any previous copy so files removed from the bundle don't linger.
[tasks."app:install"]
description = "Build without LTO (profile.local) and install it into /Applications"
depends = ["build:local"]
run = ["rm -rf /Applications/Herdr.app", "ditto $LOCAL_APP /Applications/Herdr.app"]

[tasks."app:install:release"]
description = "Build the release bundle, as shipped, and install it into /Applications"
depends = ["build"]
run = ["rm -rf /Applications/Herdr.app", "ditto $APP /Applications/Herdr.app"]

# Call it `mise run fmt`: bare `mise fmt` is mise's own mise.toml formatter.
[tasks.fmt]
description = "Format the backend in place"
dir = "src-tauri"
run = "cargo fmt"

[tasks."fmt:check"]
description = "Fail when the backend is not formatted"
dir = "src-tauri"
run = "cargo fmt --check"

[tasks.typecheck]
description = "Type-check the frontend"
run = "pnpm typecheck"

[tasks.lint]
description = "Lint the backend; any warning fails"
dir = "src-tauri"
run = "cargo clippy -- -D warnings"

[tasks."test:frontend"]
description = "Frontend unit tests"
run = "pnpm test"

# Real mouse and key events in the installed Chrome (headless); not part of `ci`.
[tasks."test:browser"]
description = "Frontend tests that need a real browser (*.browser.test.tsx)"
run = "pnpm vitest run --config vitest.browser.config.ts"

[tasks."docs:ui-map"]
description = "Redraw docs/design/ui-map.html from the real App (after a UI change)"
run = [
  "pnpm vitest run --config vitest.uimap.config.ts",
  "node scripts/ui-map.mjs",
]

[tasks."test:backend"]
description = "Backend unit tests"
dir = "src-tauri"
run = "cargo test"

[tasks.test]
description = "Frontend and backend unit tests"
depends = ["test:frontend", "test:backend"]

# Starts isolated `herdrapp-test-*` sessions on the local herdr and always
# stops and deletes them. The SSH test only runs when HERDR_APP_SSH_TEST is set.
[tasks."test:integration"]
description = "Integration tests against a real local herdr"
dir = "src-tauri"
run = "cargo test -- --ignored --test-threads=1"

# Read-only, runs on pre-commit (.githooks/pre-commit).
[tasks.ci]
description = "The gate: format, typecheck, lint and test must pass"
depends = ["fmt:check", "typecheck", "lint", "test"]
run = "echo 'ci passed'"

# Regenerates src-tauri/icons from one square source image. Only needed when the
# icon itself changes; the committed icons are what `build` packages.
[tasks."gen:icons"]
description = "Regenerate app icons from a source image"
usage = 'arg "[source]" default="src-tauri/icons/icon.png" help="Square PNG or SVG, 1024px+"'
run = 'pnpm tauri icon "${usage_source}"'

[tasks.clean]
description = "Remove frontend and cargo build output"
run = ["rm -rf dist", "cargo clean --manifest-path src-tauri/Cargo.toml"]
