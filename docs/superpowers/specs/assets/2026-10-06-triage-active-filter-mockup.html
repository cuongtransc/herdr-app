<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sidebar filter: Active</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;color:#e6e6e8}
a{color:#a5a6ff}a:hover{color:#c4c5ff}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; background: #1b1c20; display: flex; overflow: hidden; border-radius: 12px; border: 1px solid #2c2d33">

  <nav aria-label="Machines" style="width: 248px; flex: none; display: flex; flex-direction: column; background: #202125; border-right: 1px solid #2c2d33">
    <div style="height: 46px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 16px; box-sizing: border-box">
      <span style="width: 12px; height: 12px; border-radius: 50%; background: #ff5f57"></span>
      <span style="width: 12px; height: 12px; border-radius: 50%; background: #febc2e"></span>
      <span style="width: 12px; height: 12px; border-radius: 50%; background: #28c840"></span>
      <span style="flex: 1"></span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a3a4ab" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M9 4v16"></path></svg>
    </div>
    <div style="flex: 1; min-height: 0; padding: 0 8px 8px; display: flex; flex-direction: column; gap: 2px">
      <div style="display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 8px; border: 1px solid rgba(224,164,58,0.4); background: rgba(224,164,58,0.08); font-size: 13px; margin-bottom: 8px">
        <span style="flex: 1">Agent Dashboard</span>
        <span style="font-size: 11px; color: #f0b54d; font-weight: 700">● 2</span>
        <span style="font-size: 11px; color: #5aa2f0; font-weight: 700">● 3</span>
        <span style="font-size: 11px; color: #4cc38a; font-weight: 700">● 1</span>
      </div>

      <div style="display: flex; align-items: center; gap: 8px; padding: 4px 8px 6px">
        <span style="flex: 1; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #75767d">Sessions</span>
        <div role="group" aria-label="Show sessions" style="display: flex; padding: 2px; border-radius: 7px; background: #2a2b31; font-size: 11.5px">
          <button aria-pressed="false" style="border: 0; padding: 3px 9px; border-radius: 5px; background: none; color: #8a8b92">All</button>
          <button aria-pressed="true" style="border: 0; padding: 3px 9px; border-radius: 5px; background: #3a3b42; color: #e6e6e8; font-weight: 600">Active 6</button>
        </div>
      </div>

      <div style="padding: 6px 8px 2px; font-size: 11px; color: #75767d">★ Bookmarks</div>
      <div style="display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 6px; background: rgba(224,164,58,0.12); font-size: 13px">
        <span style="width: 8px; height: 8px; border-radius: 50%; background: #f0b54d"></span><span style="flex: 1">ca</span><span style="font-size: 10.5px; font-weight: 700; color: #f0b54d">INPUT</span>
      </div>

      <div style="padding: 10px 8px 2px; font-size: 11px; color: #75767d">▾ Work · XBIT</div>
      <div style="display: flex; align-items: center; gap: 8px; padding: 6px 10px 6px 20px; border-radius: 6px; background: rgba(224,164,58,0.12); font-size: 13px">
        <span style="width: 8px; height: 8px; border-radius: 50%; background: #f0b54d"></span><span style="flex: 1">w-xb</span><span style="font-size: 10.5px; color: #8a8b92">ct-hms-lan</span>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; padding: 6px 10px 6px 20px; border-radius: 6px; font-size: 13px">
        <span style="width: 8px; height: 8px; border-radius: 50%; background: #5aa2f0"></span><span style="flex: 1">xb-common</span>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; padding: 6px 10px 6px 20px; border-radius: 6px; font-size: 13px">
        <span style="width: 8px; height: 8px; border-radius: 50%; background: #5aa2f0"></span><span style="flex: 1">wd-bmf</span>
      </div>

      <div style="padding: 10px 8px 2px; font-size: 11px; color: #75767d">▾ Personal</div>
      <div style="display: flex; align-items: center; gap: 8px; padding: 6px 10px 6px 20px; border-radius: 6px; font-size: 13px">
        <span style="width: 8px; height: 8px; border-radius: 50%; background: #4cc38a"></span><span style="flex: 1">ct</span><span style="font-size: 10.5px; font-weight: 700; color: #4cc38a">DONE</span>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; padding: 6px 10px 6px 20px; border-radius: 6px; background: #2c2d34; font-size: 13px">
        <span style="width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid #75767d; box-sizing: border-box"></span><span style="flex: 1; color: #c9c9ce">ai-tools</span><span style="font-size: 10.5px; color: #75767d">idle · viewing</span>
      </div>

      <div style="flex: 1"></div>
      <button style="display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px dashed #3a3b42; border-radius: 8px; background: none; color: #8a8b92; font-size: 12px; text-align: left">
        <span style="flex: 1">6 hidden · idle or stopped</span><span style="color: #a5a6ff">Show</span>
      </button>
    </div>
  </nav>

  <aside aria-label="Agents" style="width: 288px; flex: none; display: flex; flex-direction: column; background: #1f2024; border-right: 1px solid #2c2d33">
    <div style="height: 46px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 16px; box-sizing: border-box; border-bottom: 1px solid #2c2d33">
      <span style="font-weight: 600; font-size: 13px">ai-tools</span>
      <span style="min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; display: grid; place-items: center; border-radius: 999px; background: #2c2d34; color: #a3a4ab; font-size: 11px; font-weight: 600">2</span>
    </div>
    <div style="padding: 10px 8px; display: flex; flex-direction: column; gap: 2px">
      <div style="padding: 8px 10px; border-radius: 8px; font-size: 13px">Index notes<div style="font-size: 10.5px; color: #75767d; font-weight: 700; margin-top: 3px">IDLE</div></div>
      <div style="padding: 8px 10px; border-radius: 8px; font-size: 13px">shell<div style="font-size: 10.5px; color: #75767d; font-weight: 700; margin-top: 3px">—</div></div>
    </div>
  </aside>

  <main style="flex: 1; min-width: 0; display: flex; flex-direction: column">
    <div style="height: 46px; flex: none; display: flex; align-items: center; padding: 0 18px; box-sizing: border-box; background: #212226; border-bottom: 1px solid #2c2d33; font-size: 13px; color: #8a8b92">local › ai-tools › notes › <span style="color: #e6e6e8; font-weight: 600; margin-left: 4px">Index notes</span></div>
    <div style="flex: 1; display: grid; place-items: center; color: #75767d; font-size: 13px">(the selected pane)</div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
